[package]
name = "bp-buffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# 1.x rather than 2.0.0-beta. The buffer is the one component where a
# mid-flight API break would ripple through everything above it, and
# BP-ADR-0015 already weighed API stability heavily.
#
# `cr_lines` and not the default `unicode_lines`: a line ends at LF, CRLF or
# a bare CR and nothing else (decision D6, `src/breaks.rs`). `unicode_lines`
# also broke lines at VT, FF, U+0085, U+2028 and U+2029, which no other part
# of the product did, so the caret and Find in Files disagreed about line
# numbers. `simd` is the other default, kept.
ropey = { version = "1", default-features = false, features = ["cr_lines", "simd"] }
# Errors that name the file. A chunked read fails halfway through a 2 GB file
# far more often than a whole-file read fails, so the failure path is part of
# the interface rather than an afterthought.
thiserror.workspace = true

[dev-dependencies]
# Every large-file test generates its fixture at run time under a temporary
# directory. Nothing multi-gigabyte belongs in a checkout, and a test that
# writes into the working tree has caused a real incident here.
tempfile.workspace = true

[[bench]]
name = "large_file"
harness = false

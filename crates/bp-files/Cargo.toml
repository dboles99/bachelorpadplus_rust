[package]
name = "bp-files"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bp-core = { path = "../bp-core" }
bp-naming = { path = "../bp-naming" }
# The measured size classes (ADR-0027). Loading must refuse what the editor
# cannot hold *before* reading it, and the thresholds that say so live with
# the large-file engine that measured them rather than being copied here.
# `bp-buffer` depends on nothing in the workspace, so this adds no cycle.
bp-buffer = { path = "../bp-buffer" }
# The platform's rules about names, as data. `bp-naming` sanitises the names
# *we* generate; this is for the ones the user types into a Save dialog, which
# nothing had ever checked. `bp-platform` carries no third-party dependencies,
# so this adds a path edge and nothing else to the tree.
bp-platform = { path = "../bp-platform" }
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
# Already in the workspace and in nine other crates; nothing new enters the
# tree. The load/encode inverse is a property, not three examples.
proptest.workspace = true

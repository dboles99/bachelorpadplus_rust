# The gate. Hosted CI is the primary check (ADR-0091); the local gate in
# scripts/Invoke-LocalCI.ps1 is the fallback for when GitHub is unavailable --
# an outage, or Actions blocked for billing. See docs/governance/LOCAL_CI.md.
# Releases are built by a local script (release plan decision 19), so nothing
# here builds or uploads a release.
#
# It runs the gate script itself rather than a copy of its steps (release
# plan M3-07). An earlier version listed fmt, check, clippy and test by hand
# and had already fallen behind: no launch stage, no log-hygiene stage, no
# licence and advisory checks, and no system packages, so it could not even
# have built the shell on Linux. Two gates that disagree are worse than one;
# one gate run in two places cannot disagree.
#
# ## Why every push, and not only pull requests and `main`
#
# ADR-0082 scoped this to pull requests and `main` because the repository was
# private and Actions minutes were metered, Windows at 2x. The repository is
# public and the minutes are free, so that reasoning no longer holds and
# ADR-0082 said it should then be revisited. A push to a feature branch now
# gets an independent machine's verdict instead of waiting for a pull request.
#
# `concurrency` cancels a run the next push has made redundant, so a branch
# with an open pull request does not queue two gates for every commit.

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # About's commit line and the build script's dirty flag read git.
          fetch-depth: 0
      # No toolchain action: `rust-toolchain.toml` pins the toolchain, and
      # rustup (preinstalled on both runners) honours it on first use.
      - name: Linux build and launch dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev \
            libxkbcommon-dev libxcb1-dev libgl1-mesa-dev libwayland-dev libssl-dev \
            libxkbcommon-x11-0 libxcb-cursor0 xvfb xauth
      - name: Licence and advisory tools
        run: cargo install --locked cargo-deny
      - uses: Swatinem/rust-cache@v2
      # PowerShell 7 is preinstalled on both runners. On Windows the gate
      # runs its native leg only: the WSL leg (-Linux) is what the ubuntu
      # job is for.
      - name: Gate
        shell: pwsh
        run: ./scripts/Invoke-LocalCI.ps1

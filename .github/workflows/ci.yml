# DORMANT -- GitHub Actions is not available for this project (ADR-0016).
#
# The authoritative gate is local: scripts/Invoke-LocalCI.ps1, wired into
# pre-commit and pre-push by scripts/Install-GitHooks.ps1. See
# docs/governance/LOCAL_CI.md. Releases are built by a local script too
# (release plan decision 19), so nothing here builds or uploads a release.
#
# This file is kept, and kept correct, so hosted CI can be switched back on
# without rebuilding it. The trigger is `workflow_dispatch` only, so pushes
# do not queue runs that cannot execute. To re-enable, restore:
#
#   on:
#     push:
#     pull_request:
#
# It runs the gate script itself rather than a copy of its steps (release
# plan M3-07). An earlier version listed fmt, check, clippy and test by hand
# and had already fallen behind: no launch stage, no log-hygiene stage, no
# licence and advisory checks, and no system packages, so it could not even
# have built the shell on Linux. Two gates that disagree are worse than one;
# one gate run in two places cannot disagree.

name: CI

on:
  workflow_dispatch:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # About's commit line and the build script's dirty flag read git.
          fetch-depth: 0
      # No toolchain action: `rust-toolchain.toml` pins the exact compiler,
      # and rustup (preinstalled on both runners) honours it on first use.
      - name: Linux build and launch dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev \
            libxkbcommon-dev libxcb1-dev libgl1-mesa-dev libwayland-dev libssl-dev \
            libxkbcommon-x11-0 libxcb-cursor0 xvfb xauth
      - name: Licence and advisory tools
        run: cargo install --locked cargo-deny
      - uses: Swatinem/rust-cache@v2
      # PowerShell 7 is preinstalled on both runners. On Windows the gate
      # runs its native leg only: the WSL leg (-Linux) is what the ubuntu
      # job is for.
      - name: Gate
        shell: pwsh
        run: ./scripts/Invoke-LocalCI.ps1

[workspace]
resolver = "2"
# Only crates with real content are members. The full intended crate map --
# including the ~22 not yet created -- lives in
# docs/architecture/ARCHITECTURE.md, which is where a plan belongs; an empty
# crate is a compile unit and a merge surface, not a plan. Add a crate here
# when there is something to put in it.
members = [
    "apps/bachelorpad",
    "crates/bp-audit",
    "crates/bp-buffer",
    "crates/bp-clipboard",
    "crates/bp-config",
    "crates/bp-core",
    "crates/bp-crypto",
    "crates/bp-data",
    "crates/bp-editor",
    "crates/bp-formats",
    "crates/bp-history",
    "crates/bp-naming",
    "crates/bp-integrity",
    "crates/bp-notebook",
    "crates/bp-platform",
    "crates/bp-redaction",
    "crates/bp-research",
    "crates/bp-search",
    "crates/bp-secrets",
    "crates/bp-security",
    "crates/bp-semantic",
    "crates/bp-storage",
    "crates/bp-files",
    "crates/bp-theme",
    "crates/bp-ui",
    "tests/integration",
]

# Lints every member opts into with `[lints] workspace = true`.
#
# **These four were already at zero before they were switched on.** An audit
# of the fifth session counted the panic surface of production library code
# across all 24 crates and found not one `unwrap()`, `panic!`, `todo!` or
# `unimplemented!` -- every hit was a test module or a benchmark. That is a
# discipline worth having and it was held by whoever was writing remembering
# it, which is not a mechanism. This is the mechanism.
#
# `warn` rather than `deny` on purpose: the gate runs clippy with
# `-D warnings`, so these fail the build there, while an editor and a local
# `cargo clippy` show them as warnings and let work in progress compile.
#
# Not enabled, and each for a reason rather than an oversight:
# `expect_used` (nine in library code, all carrying a message that says what
# was assumed, which is what `expect` is for), `unreachable` (one), and
# `indexing_slicing` (thirty-six, mostly over slices just measured). Turning
# any of them on is a change to the code, not a change to the policy, and
# wants its own pass.
[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor, not the pin. `rust-toolchain.toml` pins the exact compiler every
# build here uses (1.94.1); this states the oldest one the code claims to
# build with, so an older toolchain stops with "requires rustc 1.94" rather
# than an obscure error halfway through a dependency. The minor release, not
# the point release: a point release fixes regressions and adds no language
# or library surface. Every member inherits it (`rust-version.workspace`).
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["BachelorPad+ contributors"]

# What ships (release plan M1-13). Only `cargo build --release`, and the
# release script built on it (M3-03), use this profile; `cargo test`, clippy
# and the gate build the dev profile and are untouched by it.
[profile.release]
# One codegen unit and thin LTO trade build time for a smaller, faster
# binary: the optimiser sees each crate whole and can inline across crate
# boundaries. Thin rather than fat because fat LTO costs far more build time
# for a gain that, on a binary dominated by Slint and winit, is in the noise.
lto = "thin"
codegen-units = 1
# Explicit although it is the default, because it is load-bearing. The panic
# hook in `apps/bachelorpad/src/logging.rs` writes a crash report and then
# hands over to the previous hook; with `unwind` a panic after that still
# runs destructors (passphrases are wiped on drop, files are closed) and a
# panic on a worker thread ends that thread rather than the whole process.
# `abort` would make the binary a little smaller and lose all of that.
panic = "unwind"
# Line tables only: enough to turn a crash address into file, line and
# inlined function -- what crash analysis needs -- for a fraction of full
# debuginfo's build time and size. Reading a backtrace needs no variables or
# types.
debug = "line-tables-only"
# `split-debuginfo` is deliberately left at each target's default, because
# no single value is right for both desktop targets:
#
# * x86_64-pc-windows-msvc -- the default is `packed`, and it is the only
#   value rustc 1.94 accepts there (`off` and `unpacked` are errors: "is
#   unstable on this platform"). The linker writes the line tables to a
#   separate `bachelorpad.pdb`, cargo copies it next to the exe, and the exe
#   records only the PDB's file name (`/PDBALTPATH:%_PDB%`), not the build
#   path. rustc ignores `strip` for MSVC -- it always links with `/DEBUG` --
#   so the exe is symbol-free and the PDB is kept: exactly the split wanted.
#
# * x86_64-unknown-linux-gnu -- the default is `off`. `packed` would write a
#   `bachelorpad.dwp`, but one that is useless after `strip` below: split
#   DWARF leaves the line tables and the address table in the executable,
#   `strip` removes them, and the `.dwp` is left holding entries that resolve
#   to no address (checked with llvm-dwarfdump on a stripped 1.94.1 build: no
#   `.debug_line`, no `.debug_addr`). The split that works on Linux is
#   objcopy's, and it belongs to the release script: build with
#   `--config profile.release.strip=false`, then
#   `objcopy --only-keep-debug bachelorpad bachelorpad.debug` and
#   `objcopy --strip-all --add-gnu-debuglink=bachelorpad.debug bachelorpad`
#   (checked on 1.94.1: `addr2line -e bachelorpad.debug` resolves function
#   and line, and std's backtrace follows the debuglink when the file sits
#   beside the binary).
#
# Symbols are removed from the exe on both targets, so unless the PDB or
# `.debug` file is installed beside it, the in-process backtrace in a crash
# report prints `<unknown>` frames (the panic's own file:line survives -- it
# is a string, not debuginfo). Reading such a report offline against the
# kept symbols needs raw addresses and the module's load base in the report,
# which it does not record yet.
#
# `symbols` removes the symbol table as well as debuginfo. On MSVC it is a
# no-op (see above); on Linux it is most of the saving.
strip = "symbols"

[workspace.dependencies]
anyhow = "1"
csv = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps an object's keys in the order they were written.
# Without it `serde_json::Map` is a `BTreeMap`, and every round trip through
# a `Value` -- Data > Format, Minify, every conversion -- silently re-sorts
# the user's keys. Sorting is an operation (`bp_data::json_sort_keys`), not
# a side effect of parsing.
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# `local-offset` is needed because every timestamp we show the user (last
# save, checkpoint, filename date) is a local wall-clock value, not UTC.
time = { version = "0.3", features = ["local-offset"] }
tempfile = "3"
proptest = "1"
toml = "1"

# --- cryptography (ADR-0021) -------------------------------------------
# All RustCrypto, all composed rather than reimplemented, which is the line
# ADR-0011 draws. Pinned at the workspace so one version of each primitive is
# in the tree -- two versions of an AEAD is two implementations to trust.
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
getrandom = "0.3"
# Only for naming recovery-journal files by a stable digest of the document's
# path (ADR-0022). Not used for key derivation -- that is Argon2id's job.
sha2 = "0.10"
# Ed25519 signatures (specs.md section 15). RustCrypto-adjacent, audited, and
# the conventional choice; composed, never reimplemented (ADR-0011).
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

# YAML (phase 6). `serde_yaml` is deprecated and `yaml-rust2` is superseded;
# `saphyr` is the maintained successor and the only one of the three that is
# YAML 1.2 compliant. `saphyr-parser` is its own event-level half, taken
# directly because `bp-data` must measure a document's nesting depth *before*
# a tree is built for it -- see `yaml_nesting_depth`. `default-features =
# false` drops `encoding_rs`: every caller here hands us a `&str`, so the
# encoding-sniffing half of `saphyr` is weight with no reader.
saphyr = { version = "0.0.12", default-features = false }
saphyr-parser = "0.0.12"
